<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SSCIM — page not found</title>
<script>(function(){try{var t=localStorage.getItem('sscim-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  /* A static file served by the host before any bundle loads, so it
     carries the handful of tokens it needs rather than importing the
     shared stylesheet. The values are the shared ones. */
  :root{
    --page:#101214;--panel:#1A1E22;--sunken:#15181B;--rule:#2A3036;
    --accent:#7FA3D8;--ink:#E8EAEC;--ink-2:#99A1AA;--ink-3:#838C96;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --page:#FBFAF8;--panel:#FFFFFF;--sunken:#F3F1EC;--rule:#DFDBD3;
    --accent:#2C5B96;--ink:#1C1F23;--ink-2:#4C535B;--ink-3:#6E767F;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:var(--page);color:var(--ink);padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:46ch}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px;line-height:1.15}
  p{color:var(--ink-2);line-height:1.6;font-size:14px;margin:0 0 16px}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--sunken);border:1px solid var(--rule);padding:1px 5px;border-radius:4px}
  nav{display:flex;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--rule)}
  a{color:var(--accent);text-decoration:none;font-size:13px}
  a:hover{text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="title">Page not found</h1>
  <p id="body">That address does not exist on this site.</p>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/docs.html">Documentation</a>
    <a href="/intro.html">Guide</a>
    <a href="/sscim-app.html">Dashboard</a>
  </nav>
</main>
<script>
/* Each document is published as <path>.md.html. A request for the raw
   Markdown — /PUBLIC_GUIDE.md, or a link shared before the pages existed —
   should land on that page rather than dead-ending here. A bare filename is
   assumed to live under docs/, which is where all but a few of them are. */
(function () {
  var path = decodeURIComponent(location.pathname.replace(/^\/+/, ''));
  if (!/\.md$/i.test(path)) return;
  var target = path.indexOf('/') === -1 ? 'docs/' + path : path;
  document.getElementById('title').textContent = 'Opening the document…';
  document.getElementById('body').textContent = 'Documentation is published as HTML pages; redirecting to this one.';
  location.replace('/' + target + '.html');
})();
</script>
</body>
</html>
